name: Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'backend/go.sum'

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Build Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip

      - name: Build & Package Source Code ZIP
        run: |
          chmod +x build-releases.sh
          ./build-releases.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/LoadForge-SourceCode.zip
          name: "LoadForge ${{ github.ref_name }} — High-Concurrency Local Load Testing Platform"
          body: |
            ## ⚡ LoadForge ${{ github.ref_name }} Release

            ### 📦 Complete Source Code Package (Backend & Frontend):
            - 👉 [`LoadForge-SourceCode.zip`](https://github.com/khajumsanjog/LoadForge/raw/main/releases/LoadForge-SourceCode.zip) *(Contains both `backend/` and `frontend/` folders for Mac, Linux, and Windows)*

            ---

            ### 🚀 Quick Start (Run on Mac, Linux, or Windows):
            ```bash
            # Unzip LoadForge-SourceCode.zip
            cd LoadForge/backend

            # Run LoadForge
            go run main.go -browser
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
