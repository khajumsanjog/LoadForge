name: Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build & Package All Release ZIPs
        run: |
          chmod +x build-releases.sh
          ./build-releases.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/LoadForge-macOS-AppleSilicon.zip
            releases/LoadForge-macOS-Intel.zip
            releases/LoadForge-Windows-x64.zip
            releases/LoadForge-Linux-x64.zip
            releases/loadforge-darwin-arm64
            releases/loadforge-darwin-amd64
            releases/loadforge-linux-amd64
            releases/loadforge-windows-amd64.exe
          title: "LoadForge ${{ github.ref_name }} — High-Concurrency Local Load Testing Platform"
          body: |
            ## ⚡ LoadForge ${{ github.ref_name }} Release

            ### 📦 Easy 1-Click Run Packages (Double-Click to Launch):
            - 🍏 **macOS Apple Silicon (M1/M2/M3/M4)**: [`LoadForge-macOS-AppleSilicon.zip`](https://github.com/khajumsanjog/LoadForge/raw/main/releases/LoadForge-macOS-AppleSilicon.zip) *(Unzip & double-click `Double-Click-To-Run.command`)*
            - 💻 **macOS Intel**: [`LoadForge-macOS-Intel.zip`](https://github.com/khajumsanjog/LoadForge/raw/main/releases/LoadForge-macOS-Intel.zip) *(Unzip & double-click `Double-Click-To-Run.command`)*
            - 🪟 **Windows (x64)**: [`LoadForge-Windows-x64.zip`](https://github.com/khajumsanjog/LoadForge/raw/main/releases/LoadForge-Windows-x64.zip) *(Unzip & double-click `Double-Click-To-Run.bat`)*
            - 🐧 **Linux (x64)**: [`LoadForge-Linux-x64.zip`](https://github.com/khajumsanjog/LoadForge/raw/main/releases/LoadForge-Linux-x64.zip) *(Unzip & run `./run.sh`)*

            ---

            ### ⚡ 1-Line Universal Terminal Installer:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/khajumsanjog/LoadForge/main/install.sh | sh
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
