name: Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Build Cross-Platform Go Binaries
        run: |
          mkdir -p releases
          cd backend

          echo "Compiling macOS ARM64 (Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../releases/loadforge-darwin-arm64 main.go

          echo "Compiling macOS AMD64 (Intel)..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../releases/loadforge-darwin-amd64 main.go

          echo "Compiling Linux AMD64 (x86_64)..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../releases/loadforge-linux-amd64 main.go

          echo "Compiling Windows AMD64 (.exe)..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../releases/loadforge-windows-amd64.exe main.go

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/loadforge-darwin-arm64
            releases/loadforge-darwin-amd64
            releases/loadforge-linux-amd64
            releases/loadforge-windows-amd64.exe
          title: "LoadForge ${{ github.ref_name }} — High-Concurrency Local Load Testing Platform"
          body: |
            ## ⚡ LoadForge ${{ github.ref_name }} Release
            
            High-Concurrency Local Load Testing & Performance Observability Platform.

            ### 📦 Download Pre-Compiled Executables:
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `loadforge-darwin-arm64`
            - **macOS Intel**: `loadforge-darwin-amd64`
            - **Linux 64-bit**: `loadforge-linux-amd64`
            - **Windows 64-bit**: `loadforge-windows-amd64.exe`

            ### 🚀 Quick Start:
            ```bash
            # macOS / Linux
            chmod +x loadforge-darwin-arm64
            ./loadforge-darwin-arm64 -port 8080 -browser

            # Windows
            .\loadforge-windows-amd64.exe -port 8080 -browser
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
